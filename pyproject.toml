[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pillardisk"
version = "0.1.0"
description = "AGN accretion disc lag spectra and emission-line VDMs with Gaussian pillar bumps."
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
extras = ["scipy", "pandas", "tqdm"]

# src layout: the package lives in src/pillardisk (core disc/line modules
# and the transient/ subpackage); scripts/, debug/, tests/ and docs/ at the
# repo root use it after `pip install -e .`
[project.scripts]
emu = "pillardisk.transient.ray_emulator:main"
rays = "pillardisk.transient.cloudy_rays:main"

[tool.setuptools.packages.find]
where = ["src"]
